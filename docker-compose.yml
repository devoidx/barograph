services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barograph
      POSTGRES_USER: barograph
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - barograph_db:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://barograph:${DB_PASSWORD}@db:5432/barograph
      UKHO_API_KEY: ${UKHO_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      - backend

volumes:
  barograph_db:
